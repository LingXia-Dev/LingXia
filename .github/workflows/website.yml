name: Website

# The workspace pipeline ignores `website/**`, so the site gets its own check.
# Building it is the check that matters: the references are generated from
# `packages/lingxia-types` and `packages/lingxia-elements`, and the Logic API
# generator fails when the `lx.*` surface no longer matches its grouping.

on:
  push:
    branches: [main]
    paths: ['website/**', 'packages/lingxia-types/**', 'packages/lingxia-elements/**', '.github/workflows/website.yml']
  pull_request:
    branches: [main]
    paths: ['website/**', 'packages/lingxia-types/**', 'packages/lingxia-elements/**', '.github/workflows/website.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm run build
