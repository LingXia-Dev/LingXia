name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      focus:
        description: Run only one focused validation job
        required: true
        default: auto
        type: choice
        options:
          - auto
          - automation-full
          - automation-windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"
  OHOS_SDK_VERSION: "6.1-Release"
  OHOS_SDK_URL: "https://repo.huaweicloud.com/openharmony/os/6.1-Release/ohos-sdk-windows_linux-public.tar.gz"
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  # Detect which areas changed so PRs only run the relevant jobs. A core rust /
  # CLI / web-runtime / CI change fans out to everything; platform-specific SDK
  # or example changes stay scoped (e.g. an android-sdk-only PR skips iOS/macOS).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.compute.outputs.rust }}
      i18n: ${{ steps.compute.outputs.i18n }}
      ios: ${{ steps.compute.outputs.ios }}
      macos: ${{ steps.compute.outputs.macos }}
      android: ${{ steps.compute.outputs.android }}
      runner: ${{ steps.compute.outputs.runner }}
      sdk_apple: ${{ steps.compute.outputs.sdk_apple }}
      sdk_android: ${{ steps.compute.outputs.sdk_android }}
      harmony: ${{ steps.compute.outputs.harmony }}
      npm: ${{ steps.compute.outputs.npm }}
      automation: ${{ steps.compute.outputs.automation }}
      automation_matrix: ${{ steps.compute.outputs.automation_matrix }}
      automation_types: ${{ steps.compute.outputs.automation_types }}
      cli_build: ${{ steps.compute.outputs.cli_build }}
      cli_matrix: ${{ steps.compute.outputs.cli_matrix }}
      cli_fingerprint: ${{ steps.compute.outputs.cli_fingerprint }}
      rust_test: ${{ steps.compute.outputs.rust_test }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'clippy.toml'
            cli:
              - 'tools/**'
            web_runtime:
              - 'packages/lingxia-bridge/**'
              - 'packages/lingxia-polyfills/**'
            web_frontend:
              - 'packages/lingxia-elements/**'
              - 'packages/lingxia-react/**'
              - 'packages/lingxia-vue/**'
              - 'packages/lingxia-page-runtime/**'
            apple_sdk:
              - 'lingxia-sdk/apple/**'
            android_sdk:
              - 'lingxia-sdk/android/**'
            harmony_sdk:
              - 'lingxia-sdk/harmony/**'
            # Native rust the SDKs embed (webview + core runtime crate).
            core_rust:
              - 'crates/lingxia/**'
              - 'crates/lingxia-webview/**'
            webview_harmony:
              - 'crates/lingxia-webview/src/harmony/**'
            sdk_release:
              - 'scripts/release/sdk.sh'
            examples_common:
              - 'examples/lingxia-showcase/lingxia.yaml'
              - 'examples/lingxia-showcase/AppIcon.png'
              - 'examples/lingxia-showcase/icons/**'
              - 'examples/lingxia-showcase/lxapp/**'
              - 'examples/lingxia-showcase/native/**'
              - 'examples/lingxia-showcase/lingxia-lib/**'
              - 'examples/lingxia-showcase/lingxia-showcase/**'
              - 'examples/lingxia-chat/**'
            ex_ios:
              - 'examples/lingxia-showcase/ios/**'
            ex_macos:
              - 'examples/lingxia-showcase/macos/**'
            ex_android:
              - 'examples/lingxia-showcase/android/**'
            ex_harmony:
              - 'examples/lingxia-showcase/harmony/**'
            i18n:
              - 'i18n/**'
            npm:
              - 'packages/**'
            # Source of truth for the generated @lingxia/types Logic API.
            typegen_src:
              - 'crates/lingxia-logic/**'
            automation_types:
              - 'packages/lingxia-types/**'
            # Runtime paths exercised by the Showcase end-to-end contracts on
            # both desktop JS engines. Platform-only implementations are
            # filtered separately so they do not fan out to the other OS.
            automation_cross_platform:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'crates/lingxia/**'
              - 'crates/lingxia-app-context/**'
              - 'crates/lingxia-automation/**'
              - 'crates/lingxia-automation-runtime/**'
              - 'crates/lingxia-browser/**'
              - 'crates/lingxia-browser-shell/**'
              - 'crates/lingxia-device-io/**'
              - 'crates/lingxia-control-runtime/**'
              - 'crates/lingxia-control-protocol/**'
              - 'crates/lingxia-control-commands/**'
              - 'crates/lingxia-log/**'
              - 'crates/lingxia-logic/**'
              - 'crates/lingxia-lxapp/**'
              - 'crates/lingxia-media/**'
              - 'crates/lingxia-messaging/**'
              - 'crates/lingxia-native-codegen/**'
              - 'crates/lingxia-native-macros/**'
              - 'crates/lingxia-provider/**'
              - 'crates/lingxia-proxy/**'
              - 'crates/lingxia-service/**'
              - 'crates/lingxia-settings/**'
              - 'crates/lingxia-shell/**'
              - 'crates/lingxia-surface/**'
              - 'crates/lingxia-terminal/**'
              - 'crates/lingxia-transfer/**'
              - 'crates/lingxia-update/**'
              - 'crates/lingxia-platform/Cargo.toml'
              - 'crates/lingxia-platform/src/*.rs'
              - 'crates/lingxia-platform/src/desktop/**'
              - 'crates/lingxia-platform/src/traits/**'
              - 'crates/lingxia-webview/Cargo.toml'
              - 'crates/lingxia-webview/src/*.rs'
              - 'crates/lingxia-webview/src/events/**'
              - 'tools/lingxia-cli/**'
              - 'tools/lingxia-devtools-cli/**'
              - 'packages/lingxia-bridge/**'
              - 'packages/lingxia-polyfills/**'
              - 'packages/lingxia-terminal-settings/**'
              - 'i18n/**'
              - '.github/actions/build-web-packages/**'
            automation_macos:
              - 'lingxia-sdk/apple/**'
              - 'crates/lingxia-platform/src/apple/**'
              - 'crates/lingxia-webview/src/apple/**'
              - 'examples/lingxia-showcase/macos/**'
            automation_windows:
              - 'crates/lingxia-platform/src/windows/**'
              - 'crates/lingxia-webview/src/windows/**'
              - 'crates/lingxia-windows-build/**'
              - 'crates/lingxia-windows-contract/**'
              - 'crates/lingxia-windows-sdk/**'
              - 'examples/lingxia-showcase/windows/**'
            automation_frontend_shared:
              - 'packages/lingxia-elements/**'
              - 'packages/lingxia-page-runtime/**'
            automation_react:
              - 'packages/lingxia-react/**'
            automation_vue:
              - 'packages/lingxia-vue/**'
            # Windows covers both frontend adapters; macOS covers the React
            # view plus its platform-specific native behavior.
            automation_showcase:
              - 'examples/lingxia-showcase/lingxia.yaml'
              - 'examples/lingxia-showcase/lxapp/**'
              - 'examples/lingxia-showcase/native/**'
            automation_ci:
              - '.github/workflows/ci.yml'
              - 'scripts/ci/automation-matrix.sh'
              - 'scripts/ci/test-automation-matrix.sh'
              - 'scripts/automation/**'
            # Runner.app packaging — not the rust crate (Clippy already
            # type-checks lingxia-runner-lib). Apple FFI/SDK changes can break
            # the Swift package even when runner sources did not move.
            runner_src:
              - 'tools/lingxia-runner/**'
              - 'scripts/release/runner.sh'
              - 'crates/lingxia/src/ffi/apple.rs'
              - 'crates/lingxia-platform/src/apple/**'
              - 'crates/lingxia-webview/src/apple/**'
            ci:
              - '.github/**'
              - 'scripts/ci/**'
      - name: Test matrix selection
        shell: bash
        run: |
          bash scripts/ci/test-automation-matrix.sh
          bash scripts/ci/test-cli-matrix.sh
          bash scripts/ci/test-cli-fingerprint.sh
      - id: compute
        shell: bash
        env:
          CI_F: ${{ steps.filter.outputs.ci }}
          CORE: ${{ steps.filter.outputs.core }}
          CLI: ${{ steps.filter.outputs.cli }}
          WEB_RT: ${{ steps.filter.outputs.web_runtime }}
          WEB_FE: ${{ steps.filter.outputs.web_frontend }}
          APPLE: ${{ steps.filter.outputs.apple_sdk }}
          ANDROID: ${{ steps.filter.outputs.android_sdk }}
          HARMONY_SDK: ${{ steps.filter.outputs.harmony_sdk }}
          CORE_RUST: ${{ steps.filter.outputs.core_rust }}
          WEBVIEW_HARMONY: ${{ steps.filter.outputs.webview_harmony }}
          SDK_RELEASE: ${{ steps.filter.outputs.sdk_release }}
          EX_COMMON: ${{ steps.filter.outputs.examples_common }}
          EX_IOS: ${{ steps.filter.outputs.ex_ios }}
          EX_MACOS: ${{ steps.filter.outputs.ex_macos }}
          EX_ANDROID: ${{ steps.filter.outputs.ex_android }}
          EX_HARMONY: ${{ steps.filter.outputs.ex_harmony }}
          I18N: ${{ steps.filter.outputs.i18n }}
          NPM: ${{ steps.filter.outputs.npm }}
          TYPEGEN_SRC: ${{ steps.filter.outputs.typegen_src }}
          AUTOMATION_TYPES: ${{ steps.filter.outputs.automation_types }}
          AUTOMATION_CROSS_PLATFORM: ${{ steps.filter.outputs.automation_cross_platform }}
          AUTOMATION_MACOS: ${{ steps.filter.outputs.automation_macos }}
          AUTOMATION_WINDOWS: ${{ steps.filter.outputs.automation_windows }}
          AUTOMATION_FRONTEND_SHARED: ${{ steps.filter.outputs.automation_frontend_shared }}
          AUTOMATION_REACT: ${{ steps.filter.outputs.automation_react }}
          AUTOMATION_VUE: ${{ steps.filter.outputs.automation_vue }}
          AUTOMATION_SHOWCASE: ${{ steps.filter.outputs.automation_showcase }}
          AUTOMATION_CI: ${{ steps.filter.outputs.automation_ci }}
          RUNNER_SRC: ${{ steps.filter.outputs.runner_src }}
          FOCUS: ${{ github.event_name == 'workflow_dispatch' && inputs.focus || 'auto' }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # A release/* PR (from Prepare Release PR) only touches Cargo.toml /
          # install.sh / packages/*, so the path filters would skip sdk/harmony.
          # Force the FULL validate set on release PRs so a maintainer sees every
          # job before merging. head_ref is the PR source branch on pull_request;
          # ref_name covers workflow_dispatch runs explicitly launched on the
          # release branch by the prepare-release workflow.
          IS_RELEASE: ${{ startsWith(github.head_ref, 'release/') || startsWith(github.ref_name, 'release/') }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          any() { for v in "$@"; do [ "$v" = "true" ] && { echo true; return; }; done; echo false; }
          # On a release/* PR, every gating + advisory job runs regardless of
          # which paths actually changed.
          rel="$IS_RELEASE"
          # Anything that touches the rust build, the CLI, the embedded web
          # runtime, or CI config rebuilds everything downstream.
          rust=$(any "$rel" "$CI_F" "$CORE" "$CLI" "$WEB_RT")
          # Common base for the example apps (runtime + lxapp frontend + shared
          # example config + localized strings).
          ex_base=$(any "$rust" "$WEB_FE" "$EX_COMMON" "$I18N")
          ios=$(any "$rel" "$ex_base" "$APPLE" "$EX_IOS")
          macos=$(any "$rel" "$ex_base" "$APPLE" "$EX_MACOS")
          android=$(any "$rel" "$ex_base" "$ANDROID" "$EX_ANDROID")
          # Runner.app packaging is its own product. Clippy already type-checks
          # lingxia-runner-lib, and example-macos / sdk-apple already compile the
          # Apple SDK the Runner consumes. Rebuild the .app only when the
          # packaging surface or Apple FFI/SDK changed, plus main/release so the
          # script cannot rot. Hosted macOS has ~5 slots; a rust-wide fan-out
          # here queues automation behind a 25-min notarized package.
          runner=$(any "$rel" "$IS_MAIN_PUSH" "$APPLE" "$RUNNER_SRC")
          # The platform SDKs embed the web runtime (bridge/polyfills) + i18n +
          # the core rust crates, so fan those signals in too.
          sdk_base=$(any "$WEB_RT" "$I18N" "$CORE_RUST")
          # SDK platform checks stay scoped unless shared runtime/release inputs changed.
          sdk_apple=$(any "$rel" "$sdk_base" "$APPLE" "$SDK_RELEASE")
          sdk_android=$(any "$rel" "$sdk_base" "$ANDROID" "$SDK_RELEASE")
          # Harmony: harmony SDK tree + harmony webview backend + harmony example inputs.
          harmony=$(any "$rel" "$sdk_base" "$HARMONY_SDK" "$WEBVIEW_HARMONY" "$SDK_RELEASE" "$ex_base" "$EX_HARMONY")
          # NPM packages (advisory): any packages/* change, a release PR, or a
          # crates/lingxia-logic change (it is the generation source for
          # @lingxia/types, so Rust-only PRs must still run the drift gate).
          npm=$(any "$rel" "$NPM" "$TYPEGEN_SRC")
          i18n="$I18N"

          automation_full=$(any "$rel" "$IS_MAIN_PUSH" "$AUTOMATION_SHOWCASE" "$AUTOMATION_CI")
          automation_cross_platform=$(any "$AUTOMATION_CROSS_PLATFORM" "$AUTOMATION_TYPES")
          automation_macos="$AUTOMATION_MACOS"
          automation_windows="$AUTOMATION_WINDOWS"
          automation_frontend_shared="$AUTOMATION_FRONTEND_SHARED"
          automation_react="$AUTOMATION_REACT"
          automation_vue="$AUTOMATION_VUE"
          automation_macos_all=false
          automation_windows_all=false

          # Focused workflow_dispatch runs are an iteration aid. Pull requests
          # still use the path-based gate above.
          case "$FOCUS" in
            automation-full)
              automation_full=true
              ;;
            automation-windows)
              automation_full=false
              automation_windows_all=true
              ;;
          esac

          if [[ "$FOCUS" != "auto" ]]; then
            rust=false
            i18n=false
            ios=false
            macos=false
            android=false
            runner=false
            sdk_apple=false
            sdk_android=false
            harmony=false
            npm=false
            automation_cross_platform=false
            automation_macos=false
            automation_windows=false
            automation_frontend_shared=false
            automation_react=false
            automation_vue=false
          fi

          matrix_outputs=$(FULL="$automation_full" \
            CROSS_PLATFORM="$automation_cross_platform" \
            MACOS="$automation_macos" \
            WINDOWS="$automation_windows" \
            MACOS_ALL="$automation_macos_all" \
            WINDOWS_ALL="$automation_windows_all" \
            FRONTEND_SHARED="$automation_frontend_shared" \
            REACT="$automation_react" \
            VUE="$automation_vue" \
            bash scripts/ci/automation-matrix.sh)
          automation=$(sed -n 's/^automation=//p' <<<"$matrix_outputs")
          automation_matrix=$(sed -n 's/^automation_matrix=//p' <<<"$matrix_outputs")
          automation_types=$(any "$rel" "$AUTOMATION_CI" "$AUTOMATION_SHOWCASE" "$TYPEGEN_SRC" "$AUTOMATION_TYPES")
          if [[ "$FOCUS" != "auto" ]]; then
            automation_types=true
          fi

          git fetch --depth=1 origin main
          cli_base=origin/main
          if [[ "${GITHUB_EVENT_NAME:-}" == "push" && -n "${EVENT_BEFORE:-}" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git fetch --depth=1 origin "$EVENT_BEFORE" && git cat-file -e "$EVENT_BEFORE^{commit}"; then
              cli_base=$EVENT_BEFORE
            fi
          fi
          cli_fingerprint=$(bash scripts/ci/cli-fingerprint.sh HEAD)
          cli_inputs_changed=$(bash scripts/ci/cli-inputs-changed.sh "$cli_base" HEAD)

          cli_cross=$(any "$rel" "$IS_MAIN_PUSH")
          cli_outputs=$(RUST="$rust" CROSS="$cli_cross" CLI_INPUTS_CHANGED="$cli_inputs_changed" \
            bash scripts/ci/cli-matrix.sh)
          cli_build=$(sed -n 's/^cli_build=//p' <<<"$cli_outputs")
          cli_matrix=$(sed -n 's/^cli_matrix=//p' <<<"$cli_outputs")

          # Workspace tests are advisory (timing-sensitive) and occupy a macOS
          # slot. Run them on main/release, not on every rust PR — they were
          # routinely queued 30–50 min behind the other macOS jobs.
          rust_test=false
          if [[ "$rust" == "true" ]]; then
            rust_test=$(any "$rel" "$IS_MAIN_PUSH")
          fi
          {
            echo "rust=$rust"
            echo "i18n=$i18n"
            echo "ios=$ios"
            echo "macos=$macos"
            echo "android=$android"
            echo "runner=$runner"
            echo "sdk_apple=$sdk_apple"
            echo "sdk_android=$sdk_android"
            echo "harmony=$harmony"
            echo "npm=$npm"
            echo "automation=$automation"
            echo "automation_matrix=$automation_matrix"
            echo "automation_types=$automation_types"
            echo "cli_build=$cli_build"
            echo "cli_matrix=$cli_matrix"
            echo "cli_fingerprint=$cli_fingerprint"
            echo "rust_test=$rust_test"
          } >> "$GITHUB_OUTPUT"

  # ---- Gating jobs (required via ci-success) ----
  fmt:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pin the action, not @master — that ref can change between two runs of
      # the same commit. This SHA is what @master resolved to on 2026-08-16, so
      # pinning it is a no-op today and a guarantee tomorrow.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # i18n + CLI compile on Linux (the linux-x64 CLI job already ships this
  # binary). Keep this off macOS so it does not take a hosted slot away from
  # Clippy / example / automation. Workspace-wide typecheck stays on the
  # macOS Clippy job — runtime crates have no plain-linux-gnu host backend.
  rust-check:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.i18n == 'true' }}
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-check-linux

      # lingxia-cli build.rs (run by the i18n gate) embeds the bridge/polyfills
      # JS runtime.
      - uses: ./.github/actions/build-web-runtime

      # The full `cargo check --workspace` is covered by the macOS Clippy job
      # (clippy is a superset of check), so this job runs only the i18n
      # generation gate and the crates it needs.
      - name: Check i18n-related crates explicitly
        run: cargo check -p lingxia-logic -p lingxia-cli

      # Byte-compares the committed Rust + TS outputs against a fresh
      # regeneration and fails on drift — catches "edited yaml but forgot to
      # run `gen i18n`". The native resource bundles are gitignored, so
      # `--check` only validates that they generate, not that they're tracked.
      - name: Verify committed i18n outputs are in sync
        run: cargo run -p lingxia-cli -- gen i18n --check

  # lingxia (lib) for the android target does not pull lingxia-terminal, so this
  # job needs only the NDK clang.
  rust-android-target:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.i18n == 'true' }}
    name: Android Target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-android

      # The runtime has no Linux host backend, but its published crate must
      # still compile on the registry's default Linux verification target.
      - name: Check WebView compiles for plain Linux
        run: cargo check -p lingxia-webview

      # C-dependency build scripts (e.g. `ring`) compile even under `cargo
      # check`, so they need the NDK clang. The ubuntu runner ships the NDK;
      # point cc/ar/linker at it for the android target (API matches the
      # example's minSdk = 29), mirroring what `lingxia build` sets.
      - name: Configure Android NDK toolchain
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=29
          test -x "$BIN/aarch64-linux-android${API}-clang" || {
            echo "NDK clang not found in $BIN" >&2; find "$BIN" -maxdepth 1 -type f | head; exit 1;
          }
          echo "$BIN" >> "$GITHUB_PATH"
          {
            echo "CC_aarch64-linux-android=$BIN/aarch64-linux-android${API}-clang"
            echo "CXX_aarch64-linux-android=$BIN/aarch64-linux-android${API}-clang++"
            echo "AR_aarch64-linux-android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android${API}-clang"
          } >> "$GITHUB_ENV"

      - name: Check Rust compiles for Android target
        run: cargo check --target aarch64-linux-android -p lingxia --lib

  # The Windows host stack (lingxia-windows-sdk / -contract / -build and the Windows
  # backends of lingxia-platform / lingxia-webview / lingxia-shell) is
  # cfg(target_os = "windows"), so the macOS clippy job never compiles it (and
  # excludes those crates). Clippy the full workspace on a Windows runner so the
  # Windows-only code is both type-checked and linted; together with the macOS
  # job this gives clippy coverage of every host's code paths.
  rust-windows-target:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.i18n == 'true' }}
    name: Windows Target
    runs-on: windows-latest
    # Feature checks are linear (`--each-feature`); cache save of the target
    # dir can still add a few minutes after the compile steps.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-windows

      - uses: taiki-e/install-action@cargo-hack

      # Some embedded-runtime build scripts expect the bundled bridge/polyfills JS.
      - uses: ./.github/actions/build-web-runtime

      - name: Clippy Windows host stack
        shell: bash
        run: cargo clippy --workspace -- -D warnings -A clippy::let_underscore_future

      - name: Test Windows media metadata mappings
        shell: bash
        run: cargo test -p lingxia-platform codec_subtypes_use_stable_mime_names

      - name: Test Windows device-io state and backend
        shell: bash
        run: cargo test -p lingxia-device-io --features full --lib

      - name: Test capture pipeline and desktop geometry
        shell: bash
        run: |
          cargo test -p lingxia-media --no-default-features --features capture --lib
          cargo test -p lingxia-device-io --no-default-features --features realtime-capture-provider --lib geometry
          cargo test -p lingxia-device-io --features supervision --lib supervision

      # Linear in the number of features, not 2^N. The cargo-tree script below
      # already asserts the capability graph; this only type-checks each public
      # feature plus `full` on the real Windows backend.
      - name: Check Windows device-io features
        shell: bash
        run: cargo hack check -p lingxia-device-io --each-feature --no-dev-deps

      # A desktop host that declares computerUse + mediaCapture builds
      # device-io with `full` and `realtime-capture-provider`. --each-feature
      # never compiles that union, and no workspace member enables the
      # realtime provider. Skip until the feature exists so this gate can
      # merge ahead of the capture pipeline.
      - name: Check Windows device-io product union
        shell: bash
        run: |
          if grep -q '^realtime-capture-provider' crates/lingxia-device-io/Cargo.toml; then
            cargo check -p lingxia-device-io --features full,realtime-capture-provider
          else
            echo "realtime-capture-provider is not in this tree; skipping product-union check"
          fi

      - name: Verify device-io feature boundaries
        shell: bash
        run: bash scripts/ci/check-device-io-features.sh

      - name: Test Windows local-control named pipe
        shell: bash
        run: cargo test -p lingxia-control-runtime --no-default-features --features local-control --lib named_pipe_restarts_while_an_old_client_is_open

      # The shell chrome and the terminal renderer are behind non-default
      # features, so `--workspace` above never compiles them and their unit
      # tests — glyph-to-column mapping, sidebar geometry — run nowhere else.
      - name: Test Windows shell chrome and terminal renderer
        shell: bash
        run: cargo test -p lingxia-windows-sdk --features shell-chrome,terminal-runtime --lib

      # `--workspace` above only builds each crate's default features, i.e.
      # windows-sdk's `standard`. Exercise the other tiers standalone too — in
      # particular `components` (advanced / bring-your-own-host mode, without the
      # lingxia runtime facade) and the advanced_host example, which the macOS
      # host can't compile (C deps like zstd/quickjs need the Windows SDK).
      - name: Check Windows SDK feature tiers
        shell: bash
        run: |
          cargo check -p lingxia-windows-sdk --no-default-features --features host-api
          cargo check -p lingxia-windows-sdk --no-default-features --features components
          cargo check -p lingxia-windows-sdk --no-default-features --features browser-shell
          cargo check -p lingxia-windows-sdk --no-default-features --features terminal-runtime
          cargo build --example advanced_host -p lingxia-windows-sdk --no-default-features --features host-api
          cargo build --example advanced_host -p lingxia-windows-sdk --no-default-features --features runtime

  cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli_build == 'true' }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.cli_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cli-${{ matrix.platform }}

      # lingxia-cli build.rs embeds the bridge/polyfills JS runtime.
      - uses: ./.github/actions/build-web-runtime

      # Has cargo, so it can check the fingerprint covers every linked crate.
      - name: Check CLI fingerprint inputs
        shell: bash
        run: bash scripts/ci/test-cli-fingerprint.sh

      - name: Build CLI (release)
        run: cargo build -p lingxia-cli --release --target ${{ matrix.target }}

      - name: Smoke test (version)
        shell: bash
        run: ./target/${{ matrix.target }}/release/lingxia${{ matrix.exe }} version

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: lingxia-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/lingxia${{ matrix.exe }}
          if-no-files-found: error

  # Workspace-wide lint lives on macOS: runtime crates have no plain-linux-gnu
  # host backend. Android / Windows backends are covered by the *-target jobs.
  rust-clippy:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    name: Clippy
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-rust

      # lingxia-cli build.rs embeds the bridge/polyfills JS runtime.
      - uses: ./.github/actions/build-web-runtime

      # let_underscore_future is allowed workspace-wide: the runtime spawns many
      # detached background tasks (`let _ = executor.spawn(..)`) where dropping
      # the join handle is intentional fire-and-forget, not a dropped future.
      #
      # The Windows-only crates only partly compile on macOS (their Win32 code is
      # cfg'd out, leaving helpers dead), so they are linted by the Windows
      # clippy job instead — exclude them here.
      - name: Clippy (all workspace crates)
        run: cargo clippy --workspace --exclude lingxia-windows-sdk --exclude lingxia-windows-contract --exclude lingxia-windows-build --exclude lingxia-runner-windows -- -D warnings -A clippy::let_underscore_future

      # `--workspace` builds each crate's default features only, so the
      # `lingxia` facade's `automation`-gated bootstrap wiring never compiles.
      # The Runner enables it by default; lint that path too.
      - name: Clippy (lingxia automation feature)
        run: cargo clippy -p lingxia --features automation -- -D warnings -A clippy::let_underscore_future

      # Keep external-app OAuth redirects gated. Lives here (not rust-check)
      # because lingxia-browser pulls the desktop webview/platform stack.
      - name: Test browser navigation policy
        run: cargo test -p lingxia-browser policy::tests

      - name: Test macOS activity viewer against WindowServer
        run: cargo run -p lingxia-device-io --features supervision --example pip_viewer

  runner:
    needs: changes
    if: ${{ needs.changes.outputs.runner == 'true' }}
    name: runner-macos-arm64
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pin Xcode 26.0 (Swift 6.2) to match the dev toolchain; latest-stable
      # drifts (currently 26.5) and tightens concurrency checks unpredictably.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: runner-arm64

      - uses: ./.github/actions/build-web-runtime

      # Generate the gitignored apple SDK assets (resources + swift bindings).
      - uses: ./.github/actions/bootstrap-apple-sdk

      # Restore the Apple credential store so `lingxia build` signs + notarizes
      # directly from it — same code path as a local signed build, no env
      # plumbing. The two secrets are base64 of the local store files:
      #   APPLE_CREDENTIALS_JSON_BASE64    base64 -i ~/.lingxia/apple/credentials.json
      #   APPLE_DEVELOPER_ID_JSON_BASE64   base64 -i ~/.lingxia/apple/developer-id.json
      # (the latter is produced by `lingxia auth apple import-developer-id`).
      # PRs only need an ad-hoc package to prove runner.sh still links. Signing
      # + notarize stay on main (and the release-cli executor).
      - name: Restore Apple credential store (if secrets present)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CREDS_B64: ${{ secrets.APPLE_CREDENTIALS_JSON_BASE64 }}
          DEVID_B64: ${{ secrets.APPLE_DEVELOPER_ID_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${CREDS_B64:-}" ] || [ -z "${DEVID_B64:-}" ]; then
            echo "ℹ️ Apple signing store not configured — runner will be ad-hoc signed."
            exit 0
          fi
          umask 077
          mkdir -p "$HOME/.lingxia/apple"
          printf '%s' "$CREDS_B64" | base64 -d > "$HOME/.lingxia/apple/credentials.json"
          printf '%s' "$DEVID_B64" | base64 -d > "$HOME/.lingxia/apple/developer-id.json"
          chmod 600 "$HOME/.lingxia/apple/credentials.json" "$HOME/.lingxia/apple/developer-id.json"
          echo "✅ Apple credential store restored — lingxia build will Developer-ID sign + notarize."

      # Inject the private cloud provider when its secrets are present (same-repo
      # only); a no-op on forks, so the runner still builds without it.
      - uses: ./.github/actions/cloud-provider-env
        with:
          gitea-token: ${{ secrets.GITEA_TOKEN }}
          provider-cloud-git: ${{ secrets.LINGXIA_PROVIDER_CLOUD_GIT }}

      - name: Build macOS Runner (arm64)
        # Notarization is a main-branch build check, not a PR gate or a release:
        # if Apple's service stalls, the bounded wait warns and continues with a
        # signed (un-stapled) app. Release builds omit this and go through
        # release-cli.yml. PRs stay ad-hoc (no credential store above).
        env:
          LINGXIA_NOTARIZE_BEST_EFFORT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
          LINGXIA_NOTARIZE_WAIT_TIMEOUT: "10m"
        run: bash scripts/release/runner.sh --macos-arch arm64 --out dist/runner-release

      - name: Upload Runner zip
        uses: actions/upload-artifact@v4
        with:
          name: lingxia-runner-macos-arm64
          path: dist/runner-release/*.zip
          if-no-files-found: error

  macos:
    needs: changes
    name: example-macos
    if: ${{ needs.changes.outputs.macos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pin Xcode 26.0 (Swift 6.2): the media SDK needs 6.2 concurrency inference
      # the default Xcode 16 lacks, but latest-stable (26.5) is too strict.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: example-macos
      - uses: ./.github/actions/build-web-packages
      - uses: ./.github/actions/bootstrap-apple-sdk
      - name: Test Apple bridge transport
        run: cargo test -p lingxia-webview apple::bridge_transport --lib
      # Inject the private cloud provider when its secrets are present (same-repo
      # only); a no-op on forks, so the showcase still builds without it.
      - uses: ./.github/actions/cloud-provider-env
        with:
          gitea-token: ${{ secrets.GITEA_TOKEN }}
          provider-cloud-git: ${{ secrets.LINGXIA_PROVIDER_CLOUD_GIT }}
      - uses: ./.github/actions/resolve-cli
        with:
          fingerprint: ${{ needs.changes.outputs.cli_fingerprint }}
      - name: Build macOS example app
        working-directory: examples/lingxia-showcase
        run: ../../target/debug/lingxia build --platform macos --framework react
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: example-macos-app
          path: examples/lingxia-showcase/macos/.lingxia/*.app
          if-no-files-found: warn

  showcase-automation-types:
    needs: changes
    name: automation-types
    if: ${{ needs.changes.outputs.automation_types == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-web-packages

      - name: Install showcase test dependencies
        working-directory: examples/lingxia-showcase/lxapp
        run: npm ci

      - name: Check showcase automation types
        working-directory: examples/lingxia-showcase/lxapp
        run: npm run test:automation:types

      - name: Parse automation runners
        shell: pwsh
        run: |
          foreach ($runner in @(
            'scripts/automation/run-android-showcase.ps1',
            'scripts/automation/run-windows-showcase.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $runner),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "$runner`n$($errors | Out-String)" }
          }
          bash -n scripts/automation/run-macos-showcase.sh
          if ($LASTEXITCODE -ne 0) { throw 'Could not parse macOS automation runner.' }

  showcase-automation:
    needs: changes
    name: automation-${{ matrix.platform }}-${{ matrix.profile }}
    if: ${{ needs.changes.outputs.automation == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.automation_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: "26.0"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: showcase-automation-${{ matrix.platform }}-${{ matrix.profile }}
          cache-on-failure: true

      - uses: ./.github/actions/build-web-packages

      - uses: ./.github/actions/bootstrap-apple-sdk
        if: runner.os == 'macOS'

      - name: Install showcase test dependencies
        working-directory: examples/lingxia-showcase/lxapp
        shell: bash
        run: npm ci

      - name: Run showcase automation
        if: runner.os == 'Windows'
        working-directory: examples/lingxia-showcase
        shell: pwsh
        run: >-
          ../../scripts/automation/run-windows-showcase.ps1
          -Framework '${{ matrix.framework }}'
          -TimeoutSeconds 300

      - name: Run showcase automation
        if: runner.os == 'macOS'
        run: bash scripts/automation/run-macos-showcase.sh '${{ matrix.framework }}' 300

      - name: Show session diagnostics
        if: always()
        working-directory: examples/lingxia-showcase
        shell: bash
        run: |
          ../../target/debug/lingxia${{ matrix.exe }} dev status --json || true
          ../../target/debug/lxdev${{ matrix.exe }} logs --limit 1000 || true

      - name: Stop showcase session
        if: always()
        working-directory: examples/lingxia-showcase
        shell: bash
        run: ../../target/debug/lingxia${{ matrix.exe }} dev stop || true

      # A crashed host exits the dev session silently (the jsonl just stops);
      # the runner's crash report is the only stack we get. ReportCrash writes
      # the .ips asynchronously from the corpse, so give it a moment before
      # collecting. Copy every recent report regardless of process name (the
      # VM is fresh, so any report is suspicious) and keep ReportCrash's own
      # unified-log trail so a missing report is itself diagnosable.
      - name: Collect macOS crash reports
        if: always() && runner.os == 'macOS'
        working-directory: examples/lingxia-showcase
        shell: bash
        run: |
          mkdir -p .lingxia/crash-reports
          sleep 45
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
            -name '*.ips' -mmin -90 \
            -exec cp {} .lingxia/crash-reports/ \; 2>/dev/null || true
          ls -la "$HOME/Library/Logs/DiagnosticReports" \
            > .lingxia/crash-reports/diagnostic-reports-ls.txt 2>&1 || true
          log show --last 30m --style compact \
            --predicate 'process == "ReportCrash"' \
            > .lingxia/crash-reports/reportcrash.log 2>&1 || true
          log show --last 15m --style compact \
            --predicate 'eventMessage CONTAINS[c] "LingXiaDemo"' \
            > .lingxia/crash-reports/lingxiademo-unified.log 2>&1 || true

      - name: Upload automation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-automation-${{ matrix.platform }}-${{ matrix.profile }}
          path: |
            examples/lingxia-showcase/.lingxia/dev/**
            examples/lingxia-showcase/.lingxia/background/**
            examples/lingxia-showcase/.lingxia/logs/**
            examples/lingxia-showcase/.lingxia/crash-reports/**
            examples/lingxia-showcase/lxapp/test-results/**
          if-no-files-found: warn

  ios:
    needs: changes
    name: example-ios
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Pin Xcode 26.0 (Swift 6.2): the iOS media SDK needs 6.2 inference the
      # default Xcode 16 lacks, but latest-stable drifted to 26.5 whose stricter
      # sending-checks reject it. 26.0 is below the 26.3 dev toolchain (builds clean).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Show active Xcode/Swift
        run: xcodebuild -version && swift --version
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: example-ios
      - uses: ./.github/actions/build-web-packages
      - uses: ./.github/actions/bootstrap-apple-sdk
      - uses: ./.github/actions/resolve-cli
        with:
          fingerprint: ${{ needs.changes.outputs.cli_fingerprint }}
      - name: Build iOS example app
        working-directory: examples/lingxia-showcase
        run: ../../target/debug/lingxia build --platform ios --framework react
      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: example-ios-app
          path: examples/lingxia-showcase/ios/.lingxia/*.app
          if-no-files-found: warn

  android:
    needs: changes
    name: example-android
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: example-android
      - uses: ./.github/actions/build-web-packages
      # Generate the gitignored android SDK drawables/strings the Kotlin
      # references (R.drawable.* / R.string.*).
      - uses: ./.github/actions/bootstrap-android-sdk
      - name: Expose Android NDK to lingxia build
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/resolve-cli
        with:
          fingerprint: ${{ needs.changes.outputs.cli_fingerprint }}
      - name: Build Android example app
        working-directory: examples/lingxia-showcase
        # Release build so CI exercises the release signing config (it falls back
        # to debug-signing here since no keystore is configured — see the
        # build.gradle.kts signing block). Use --env release --release locally
        # with a keystore for a Play-ready artifact.
        run: ../../target/debug/lingxia build --platform android --framework react --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: example-android-apk
          path: examples/lingxia-showcase/android/app/build/outputs/**/*.apk
          if-no-files-found: warn

  # ---- Advisory (runs + visible, NOT in ci-success.needs) ----
  # rust-test stays advisory: it has pre-existing environment/timing-dependent
  # tests (lingxia-transfer wall-clock ordering, live-shell terminal sessions).
  # PR gates skip it so it cannot occupy a macOS slot behind Clippy / examples.
  rust-test:
    needs: changes
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    name: Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-rust

      - uses: ./.github/actions/build-web-runtime

      - name: Test all workspace crates
        run: cargo test --workspace

  # sdk / harmony / npm run + are visible on PRs but are deliberately NOT in
  # ci-success.needs, so they can never block a merge. Promote each to a gating
  # job (add to ci-success.needs) only once it has proven green on real PRs.
  sdk-android:
    needs: changes
    if: ${{ needs.changes.outputs.sdk_android == 'true' }}
    name: Android SDK Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: sdk-android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-sdk-${{ hashFiles('lingxia-sdk/android/**/*.gradle*', 'lingxia-sdk/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-sdk-

      - uses: ./.github/actions/build-web-runtime

      - name: Build Android SDK release artifact
        run: bash scripts/release/sdk.sh --platform android --out dist/sdk-ci --no-shasums

  sdk-apple:
    needs: changes
    if: ${{ needs.changes.outputs.sdk_apple == 'true' }}
    name: Apple SDK Source Package
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: sdk-apple

      - uses: ./.github/actions/build-web-runtime

      - name: Build Apple SDK release artifact
        run: bash scripts/release/sdk.sh --platform apple --out dist/sdk-ci --no-shasums

  harmony-native:
    needs: changes
    if: ${{ needs.changes.outputs.harmony == 'true' }}
    name: example-harmony-native
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-ohos

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: example-harmony

      # lxapp web bundle + native client codegen the native build links against.
      - uses: ./.github/actions/build-web-packages

      # Native NDK from the public OpenHarmony SDK tarball.
      - name: Restore OpenHarmony native NDK cache
        id: ndk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/ohos-ndk
          key: ohos-ndk-${{ env.OHOS_SDK_VERSION }}

      - name: Download OpenHarmony native NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "Downloading $OHOS_SDK_URL"
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 --speed-time 120 --speed-limit 1024 "$OHOS_SDK_URL" -o /tmp/ohos-sdk.tar.gz
          du -h /tmp/ohos-sdk.tar.gz
          EXPECTED=$(curl -fsSL "${OHOS_SDK_URL}.sha256" | awk '{print $1}')
          echo "${EXPECTED}  /tmp/ohos-sdk.tar.gz" | sha256sum -c -
          mkdir -p /tmp/ohos-sdk-x
          tar -xzf /tmp/ohos-sdk.tar.gz -C /tmp/ohos-sdk-x
          LINUX_DIR=$(find /tmp/ohos-sdk-x -maxdepth 2 -type d -name linux | head -1)
          [ -n "$LINUX_DIR" ] || { echo "linux/ not found in SDK tarball"; find /tmp/ohos-sdk-x -maxdepth 2 -type d; exit 1; }
          ( cd "$LINUX_DIR" && unzip -q -o 'native-linux-x64-*.zip' )
          mkdir -p ~/ohos-ndk
          cp -a "$LINUX_DIR/native" ~/ohos-ndk/native
          rm -rf /tmp/ohos-sdk.tar.gz /tmp/ohos-sdk-x

      - name: Expose OHOS NDK
        run: |
          set -euo pipefail
          NDK=$(cd ~/ohos-ndk && pwd)
          [ -d "$NDK/native" ] || { echo "native/ missing under $NDK"; ls -la "$NDK" || true; exit 1; }
          echo "OHOS_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$NDK"
          # libavtranscoder confirms a media-complete NDK (was an earlier failure).
          find "$NDK/native" -name 'libavtranscoder*' | head -1 || true

      - name: Save OpenHarmony native NDK cache
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ohos-ndk
          key: ohos-ndk-${{ env.OHOS_SDK_VERSION }}

      # Generate the gitignored Harmony SDK resources a clean checkout lacks.
      - uses: ./.github/actions/bootstrap-harmony-sdk

      - uses: ./.github/actions/resolve-cli
        with:
          fingerprint: ${{ needs.changes.outputs.cli_fingerprint }}

      - name: Build Harmony example (native only)
        working-directory: examples/lingxia-showcase
        run: ../../target/debug/lingxia build --platform harmony --framework react --native-only

      - name: Upload native library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-harmony-libs
          path: examples/lingxia-showcase/harmony/.lingxia/**/libs/**/*.so
          if-no-files-found: warn

  npm-packages:
    needs: changes
    if: ${{ needs.changes.outputs.npm == 'true' }}
    name: Packages (workspace build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-packages-${{ hashFiles('packages/*/package.json') }}
          restore-keys: npm-packages-

      # packages/ is an npm workspace: a single install links every @lingxia/*
      # member and hoists their dev tooling, and `npm run build --workspaces`
      # then builds each member that has a build script (npm discovers them from
      # the workspace — no per-package list). Mirrors what the lingxia CLI runs
      # for an in-repo build.
      - name: Install & build workspace
        working-directory: packages
        run: |
          npm install
          npm run check:logic --workspace @lingxia/types
          npm run check:quality --workspace @lingxia/types
          npm run test:types --workspace @lingxia/types
          npm run build --workspaces --if-present

  npm-skill:
    needs: changes
    if: ${{ needs.changes.outputs.npm == 'true' }}
    name: Agent Skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-skill-${{ hashFiles('packages/lingxia-skill/package.json') }}
          restore-keys: npm-skill-

      - name: Install & Pack (@lingxia/skill)
        working-directory: packages/lingxia-skill
        run: |
          npm install
          npm pack --dry-run

  # Single required check. Skipped gating jobs report result 'skipped' (≠
  # 'failure'), so a scoped PR still goes green and stays mergeable — require
  # ONLY this check in branch protection, never the individual jobs.
  ci-success:
    name: CI Success
    needs:
      - changes
      - fmt
      - rust-check
      - rust-android-target
      - rust-windows-target
      - cli
      - rust-clippy
      - runner
      - macos
      - ios
      - android
      - showcase-automation-types
      - showcase-automation
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check gating jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ A gating job failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ A gating job was cancelled"
            exit 1
          fi
          echo "✅ Gating CI checks passed (skipped jobs are OK)"
