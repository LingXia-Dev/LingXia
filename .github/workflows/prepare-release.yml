name: Release / 1. Prepare Version PR
run-name: Prepare ${{ inputs.component }} v${{ inputs.version }}

# Version bump PR helper. `component=all` applies ONE version to the whole
# workspace/package set via scripts/release/version.sh. Independent CLI, SDK,
# crate, and npm version bumps are deliberately unsupported.
#
# After this PR merges, publish from "Release / 2. Publish Workspace Component"
# using the same workspace version.

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Version scope"
        required: true
        default: all
        type: choice
        options:
          - all
          - cli
      version:
        description: "Version to release (e.g. 0.5.0)"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare ${{ inputs.component }} v${{ inputs.version }}
    runs-on: ubuntu-latest
    # Bind dispatch inputs as env so `run:` blocks reference shell variables
    # instead of interpolating ${{ inputs.* }} directly — a free-text version
    # string must never be spliced into a shell command (script injection).
    env:
      VERSION: ${{ inputs.version }}
      COMPONENT: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate semver input
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION (expected x.y.z)" >&2
            exit 1
          fi
          case "$COMPONENT" in
            all | cli) ;;
            *)
              echo "Unknown component: $COMPONENT (expected all or cli)" >&2
              exit 1
              ;;
          esac

      - name: Create release branch
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == "cli" ]]; then
            branch="release/cli-v${VERSION}"
          else
            branch="release/v${VERSION}"
          fi
          remote_sha="$(git ls-remote --heads origin "$branch" | awk '{print $1}')"
          git checkout -B "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          echo "REMOTE_BRANCH_SHA=$remote_sha" >> "$GITHUB_ENV"

      - name: Bump version and changelog
        run: |
          set -euo pipefail
          bash scripts/release/version.sh "$VERSION" --component "$COMPONENT"
          if [[ "$COMPONENT" == "all" ]]; then
            notes_file="docs/releases/${VERSION}.md"
            bash scripts/release/main.sh changelog \
              --version "$VERSION" \
              --write CHANGELOG.md
            mkdir -p "$(dirname "$notes_file")"
            bash scripts/release/main.sh notes \
              --version "$VERSION" > "$notes_file"
          else
            notes_file="docs/releases/cli-${VERSION}.md"
            previous_cli_tag="$(git describe --tags --abbrev=0 --match='lingxia-cli-v*')"
            mkdir -p "$(dirname "$notes_file")"
            bash scripts/release/main.sh notes \
              --from "$previous_cli_tag" \
              --version "$VERSION" > "$notes_file"
          fi
          echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: Commit version bump
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No version changes to commit. The selected component already appears to be at ${VERSION}." >&2
            exit 1
          fi
          git add -A
          git commit -m "chore(release): bump ${COMPONENT} version to ${VERSION}"

      - name: Push branch
        run: |
          set -euo pipefail
          if [[ -n "$REMOTE_BRANCH_SHA" ]]; then
            git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_BRANCH_SHA" -u origin "$BRANCH"
          else
            git push -u origin "$BRANCH"
          fi

      - name: Ensure release label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create release \
            --color "0E8A16" \
            --description "Release preparation and publishing" \
            2>/dev/null || \
          gh label edit release \
            --color "0E8A16" \
            --description "Release preparation and publishing"

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$VERSION"
          # The file is a standalone document. In the PR it sits under the
          # release-notes section, so drop its title and demote its headings.
          release_notes="$(sed '1d; s/^#/##/' "$RELEASE_NOTES_FILE")"
          if [[ "$COMPONENT" == "cli" ]]; then
            pr_title="Release CLI v${version}"
          else
            pr_title="Release v${version}"
          fi
          if [[ "$COMPONENT" == "cli" ]]; then
            pr_body="$(cat <<EOF
          ## Release CLI v${version}

          CLI patch bump to \`${version}\` applied via
          \`scripts/release/version.sh --component cli\`. Only the CLI patch line
          moves:

          - \`tools/lingxia-cli/Cargo.toml\` \`[package] version\`
          - the Runner, which tracks the CLI version
          - \`Cargo.lock\`

          The workspace, the crates, the SDK and every npm package stay where they
          are, and the component versions the CLI embeds still name the base
          release it was built against.

          ### Release notes

          ${release_notes}

          ### After merge

          This bump does not publish anything on its own. Run
          **Release / 2. Publish Workspace Component** after this PR merges:

          \`\`\`bash
          component=cli, version=${version}
          \`\`\`
          EOF
          )"
          else
            pr_body="$(cat <<EOF
          ## Release v${version}

          Unified version bump to \`${version}\` applied via
          \`scripts/release/version.sh\`. This rewrites the version in one shot:

          - \`Cargo.toml\` \`workspace.package.version\` + workspace crate dep versions
          - CLI/Runner and embedded component metadata
          - every \`packages/*/package.json\` version
          - root and example lockfile workspace entries
          - the generated \`CHANGELOG.md\` section for this release

          ### Release notes

          ${release_notes}

          ### After merge

          This bump does not publish anything on its own. Run the unified
          **Release / 2. Publish Workspace Component** workflow after this PR merges.
          Publish everything with the recommended default:

          \`\`\`bash
          component=all, version=${version}
          \`\`\`

          Or select \`crates\`, \`sdk\`, \`cli\`, or \`npm\` to publish that
          component independently at the same workspace version.
          EOF
          )"
          fi

          existing_pr="$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$existing_pr" ]; then
            pr_url="$existing_pr"
            gh pr edit "$pr_url" --title "$pr_title" --body "$pr_body"
            echo "Release PR already exists: $pr_url"
          else
            pr_url="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$pr_title" \
              --body "$pr_body" \
              --label "release")"
          fi

          echo "PR_URL=$pr_url" >> "$GITHUB_ENV"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Release PR"
            echo ""
            echo "- Branch: \`$BRANCH\`"
            echo "- Pull request: $pr_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch CI for release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          dispatch_after="$(date -u +%s)"

          gh workflow run ci.yml --ref "$BRANCH"

          run_id=""
          for _ in {1..30}; do
            run_id="$(gh run list \
              --workflow ci.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,headSha \
              | jq -r \
                --arg sha "$head_sha" \
                --argjson earliest "$((dispatch_after - 5))" \
                '[.[] | select(.headSha == $sha) | select((.createdAt | fromdateiso8601) >= $earliest)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo "Failed to find dispatched CI run for $BRANCH" >&2
            exit 1
          fi

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          {
            echo ""
            echo "### CI"
            echo ""
            echo "- Run: $run_url"
          } >> "$GITHUB_STEP_SUMMARY"

          gh run watch "$run_id" --interval 15 --exit-status
