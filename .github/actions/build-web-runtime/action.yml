name: Build embedded web runtime
description: >
  Install deps and build @lingxia/bridge + @lingxia/polyfills. lingxia-cli's
  build.rs embeds these JS runtimes at compile time, so every job that compiles
  lingxia-cli — the CLI binary, the macOS runner, or `cargo {check,test,clippy}
  --workspace` — needs their dist output present first.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION || '22' }}
        cache: npm
        cache-dependency-path: packages/package-lock.json

    - name: Install workspace and build bridge + polyfills
      shell: bash
      working-directory: packages
      env:
        npm_config_script_shell: bash
      run: |
        set -euo pipefail
        npm ci
        npm run build --workspace @lingxia/bridge
        npm run build --workspace @lingxia/polyfills
