name: Resolve lingxia + lxdev
description: >
  Restore cached CLI binaries keyed by the CLI fingerprint, or install a
  matching GitHub Release, or cargo-build from this checkout. Writes
  lingxia/lxdev into target/debug so existing job paths keep working.

inputs:
  fingerprint:
    description: Output of scripts/ci/cli-fingerprint.sh for this tree
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: |
          target/debug/lingxia
          target/debug/lxdev
          target/debug/lingxia.exe
          target/debug/lxdev.exe
          target/debug/.lingxia-cli-fingerprint
        key: cli-bins-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ inputs.fingerprint }}

    # lingxia-cli vendors OpenSSL, whose Configure runs under Perl. In a
    # bash step Git's MSYS perl shadows Strawberry Perl and lacks the modules
    # Configure needs, so point openssl-src at the runner's Strawberry Perl.
    - name: Use Strawberry Perl for the vendored OpenSSL build
      if: runner.os == 'Windows'
      shell: bash
      run: printf '%s\n' 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"

    - name: Resolve lingxia and lxdev
      shell: bash
      run: bash scripts/ci/resolve-cli.sh --dest target/debug
