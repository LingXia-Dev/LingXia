name: Enable cloud provider (if configured)
description: >
  If a GitHub token that can read the private cloud client is present, check
  that repo out and export LINGXIA_WITH_PROVIDERS=cloud plus
  LINGXIA_PROVIDER_CLOUD_PATH so a following `lingxia build`/`package` injects
  it. A no-op (build without the provider) when the token is absent — i.e. on
  forks or an unconfigured repo. The clone URL is not a secret (github.com);
  only the token is. GITHUB_TOKEN cannot be used: it is scoped to this public
  repository and cannot clone LingXia-Dev/lingxia-device-cloud.
inputs:
  github-token:
    description: >
      Fine-grained PAT (resource owner LingXia-Dev, Contents: Read, repository
      LingXia-Dev/lingxia-device-cloud only).
    required: false
  repository:
    description: GitHub owner/name of the private cloud client.
    required: false
    default: LingXia-Dev/lingxia-device-cloud
  ref:
    description: Branch or SHA to check out.
    required: false
    default: main
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -z "${TOKEN:-}" ]; then
          echo "ℹ️ cloud provider token absent — building without the provider."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "enabled=true" >> "$GITHUB_OUTPUT"

    - if: steps.gate.outputs.enabled == 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.github-token }}
        path: ${{ runner.temp }}/lingxia-cloud-client
        persist-credentials: false

    - if: steps.gate.outputs.enabled == 'true'
      shell: bash
      run: |
        set -euo pipefail
        dest="${RUNNER_TEMP}/lingxia-cloud-client"
        test -f "$dest/Cargo.toml" || {
          echo "cloud client checkout missing Cargo.toml at $dest" >&2
          exit 1
        }
        {
          echo "LINGXIA_WITH_PROVIDERS=cloud"
          echo "LINGXIA_PROVIDER_CLOUD_PATH=$dest"
        } >> "$GITHUB_ENV"
        echo "✅ cloud provider enabled from ${{ inputs.repository }}@${{ inputs.ref }}."
