name: Enable cloud provider (if configured)
description: >
  If secrets for the private cloud client are present, check that repo out and
  export LINGXIA_WITH_PROVIDERS=cloud plus LINGXIA_PROVIDER_CLOUD_PATH so a
  following `lingxia build`/`package` injects it. A no-op (build without the
  provider) when the token or repository secret is absent — i.e. on forks or
  an unconfigured repo. GITHUB_TOKEN cannot be used: it is scoped to this
  public repository and cannot clone a private cloud-client repo.
  Empty/HEAD ref checks out that repo's default-branch HEAD.
inputs:
  github-token:
    description: >
      Fine-grained PAT (Contents: Read on the private cloud-client repository
      named by the repository input).
    required: false
  repository:
    description: >
      GitHub owner/name of the private cloud client. Empty skips the provider.
    required: false
  ref:
    description: >
      Branch or SHA to check out. Empty or HEAD uses the repository default
      branch (latest HEAD).
    required: false
    default: HEAD
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        if [ -z "${TOKEN:-}" ] || [ -z "${REPOSITORY:-}" ]; then
          echo "ℹ️ cloud provider secrets absent — building without the provider."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "enabled=true" >> "$GITHUB_OUTPUT"

    - id: resolve
      if: steps.gate.outputs.enabled == 'true'
      shell: bash
      env:
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPOSITORY}"
        ref="${INPUT_REF:-HEAD}"
        echo "repository=$repo" >> "$GITHUB_OUTPUT"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        if [ "$ref" = "HEAD" ]; then
          echo "pin=false" >> "$GITHUB_OUTPUT"
        else
          echo "pin=true" >> "$GITHUB_OUTPUT"
        fi

    # Omit `ref` so actions/checkout uses the cloud client's default branch HEAD.
    - if: steps.gate.outputs.enabled == 'true' && steps.resolve.outputs.pin != 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.resolve.outputs.repository }}
        token: ${{ inputs.github-token }}
        # actions/checkout requires repositories to stay under GITHUB_WORKSPACE.
        path: .ci/lingxia-cloud-client
        persist-credentials: false

    - if: steps.gate.outputs.enabled == 'true' && steps.resolve.outputs.pin == 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.resolve.outputs.repository }}
        ref: ${{ steps.resolve.outputs.ref }}
        token: ${{ inputs.github-token }}
        path: .ci/lingxia-cloud-client
        persist-credentials: false

    - if: steps.gate.outputs.enabled == 'true'
      shell: bash
      env:
        CLOUD_REF: ${{ steps.resolve.outputs.ref }}
      run: |
        set -euo pipefail
        dest="${GITHUB_WORKSPACE}/.ci/lingxia-cloud-client"
        test -f "$dest/Cargo.toml" || {
          echo "cloud client checkout missing Cargo.toml at $dest" >&2
          exit 1
        }
        {
          echo "LINGXIA_WITH_PROVIDERS=cloud"
          echo "LINGXIA_PROVIDER_CLOUD_PATH=$dest"
        } >> "$GITHUB_ENV"
        echo "✅ cloud provider enabled (${CLOUD_REF})."
