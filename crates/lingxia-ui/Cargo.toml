[package]
name = "lingxia-ui"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Experimental LingXia UI language and headless renderer"

[features]
default = []
gpu = ["dep:vello_gpu", "dep:glifo", "dep:wgpu", "dep:pollster"]
# Dev sessions only: swap a page module in place, keeping its state.
hot-swap = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
lingxia-theme = { workspace = true }
log = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
taffy = "=0.14.0"
parley = { version = "=0.12.0", features = ["complex-scripts"] }
skrifa = "=0.44.0"
roxmltree = "0.21.1"
memmap2 = "0.9.11"
vello_cpu = "=0.3.0"
vello_common = { version = "=0.3.0", default-features = false }
vello_gpu = { version = "=0.3.0", optional = true, default-features = false, features = ["wgpu", "text"] }
glifo = { version = "=0.4.0", optional = true, features = ["png"] }
wgpu = { version = "=30.0.0", optional = true, default-features = false, features = ["vulkan", "dx12", "metal", "wgsl"] }
pollster = { version = "=0.4.0", optional = true }
# The View isolate runs on QuickJS everywhere, beside the platform's Logic engine.
rong = { workspace = true, features = ["quickjs"] }
rong_core = "=0.6.5"
rong_quickjs_sys = "=0.6.1"

[target.'cfg(target_os = "android")'.dependencies]
# GLES is the fallback for Vulkan drivers the crash sentinel blocks.
wgpu = { version = "=30.0.0", optional = true, default-features = false, features = ["gles"] }

[target.'cfg(unix)'.dependencies]
# The View JS budget measures the worker thread's CPU time.
libc = "0.2"

[dev-dependencies]
# Platform-outline tests register Apple's hvgl faces.
fontique = { version = "=0.12.0", default-features = false, features = ["hvgl"] }
