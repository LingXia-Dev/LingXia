[package]
name = "lingxia-terminal-config"
version.workspace = true
edition.workspace = true
description = "Terminal configuration: schema, storage and resolution shared by every platform"
license = "MIT"
repository.workspace = true

[dependencies]
lingxia-app-context = { workspace = true }
lingxia-terminal = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
sha2 = "0.11"
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }
zip = { version = "8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
