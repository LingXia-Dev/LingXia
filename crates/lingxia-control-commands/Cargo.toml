[package]
name = "lingxia-control-commands"
version.workspace = true
edition.workspace = true
description = "Command surface shared by lxdev and shipped LingXia products"
license = "MIT"
repository.workspace = true

[features]
default = []
# The `computer` command table and the DTOs it sends. A product stops here:
# `Backend::App` forwards every verb to the running host, so the product binary
# needs the vocabulary, not an implementation it can never reach.
desktop = ["dep:lingxia-device-io", "lingxia-device-io/wire"]
# `Backend::Local` — run the verbs in this process. Only `lxdev` does that;
# host supervision stays out because a development tool is not a product host.
desktop-local = [
    "desktop",
    "lingxia-device-io/app",
    "lingxia-device-io/ax",
    "lingxia-device-io/clipboard",
    "lingxia-device-io/diagnostics",
    "lingxia-device-io/input",
    "lingxia-device-io/process",
    "lingxia-device-io/snapshot",
    "lingxia-device-io/window",
]

# The example is a product mount, so it needs the `computer` command table.
# Without this, `--all-targets` on the default feature set fails to build it.
[[example]]
name = "product"
required-features = ["desktop"]

[dependencies]
lingxia-device-io = { workspace = true, optional = true }
lingxia-control-protocol = { workspace = true }
# The persisted "is the automation interface on" answer, so a product without a
# settings screen still has a way to switch it.
lingxia-settings = { workspace = true }
anyhow = "1.0"
log = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
# `preserve_order` keeps machine JSON in the order a handler reported it.
# lxdev has always printed it that way through feature unification; declaring
# it here makes that a property of this crate rather than an accident.
serde_json = { workspace = true, features = ["preserve_order"] }
base64 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
thiserror = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
