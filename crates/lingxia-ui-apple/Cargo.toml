[package]
name = "lingxia-ui-apple"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "iOS adapter for the LingXia GPU View host: presentation and platform mechanics"

[features]
default = []
# Metal presentation through wgpu; without it frames rasterize on the CPU.
gpu = ["lingxia-ui/gpu", "dep:raw-window-handle"]

[dependencies]
lingxia-ui = { workspace = true }
log = { workspace = true }
# Apple outlines hvgl faces through CoreText, so fontique keeps them.
fontique = { version = "=0.12.0", default-features = false, features = ["hvgl"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFString", "CFURL", "CFArray", "CFData", "CFDictionary", "CFNumber", "CFCGTypes"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "CTFontManager", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGPath"] }
skrifa = "=0.44.0"
vello_cpu = "=0.3.0"
serde_json = { workspace = true }
raw-window-handle = { version = "=0.6.2", optional = true }
