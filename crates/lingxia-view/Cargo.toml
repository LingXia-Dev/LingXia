[package]
name = "lingxia-view"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Experimental LingXia UI language and headless renderer"

[features]
default = []
gpu = ["dep:vello_gpu", "dep:glifo", "dep:wgpu", "dep:pollster"]
# Dev sessions only: swap a page module in place, keeping its state.
hot-swap = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
lingxia-theme = { workspace = true }
log = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
taffy = { workspace = true }
skrifa = { workspace = true }
memmap2 = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
vello_gpu = { workspace = true, optional = true, features = ["wgpu", "text"] }
glifo = { workspace = true, optional = true, features = ["png"] }
wgpu = { workspace = true, optional = true, features = ["vulkan", "dx12", "metal", "wgsl"] }
pollster = { workspace = true, optional = true }
# The View isolate runs on QuickJS everywhere, beside the platform's Logic engine.
rong = { workspace = true, features = ["quickjs"] }
rong_core = { workspace = true }
rong_quickjs_sys = { workspace = true }

# OHOS reports `target_os = "linux"`, where parley's system fonts mean fontconfig, which OHOS
# lacks; its adapter registers system faces from the OHOS font configuration instead.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
parley = { workspace = true, default-features = true, features = ["complex-scripts"] }

[target.'cfg(target_env = "ohos")'.dependencies]
parley = { workspace = true, features = ["std", "complex-scripts"] }

[target.'cfg(target_os = "android")'.dependencies]
# GLES is the fallback for Vulkan drivers the crash sentinel blocks.
wgpu = { workspace = true, optional = true, features = ["gles"] }

[target.'cfg(unix)'.dependencies]
# The View JS budget measures the worker thread's CPU time.
libc = { workspace = true }

[dev-dependencies]
