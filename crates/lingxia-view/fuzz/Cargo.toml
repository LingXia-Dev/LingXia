[package]
name = "lingxia-view-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: fuzz builds need nightly and sanitizer flags the main one never sees.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lingxia-view = { path = ".." }
lingxia-theme = { path = "../../lingxia-theme" }
serde_json = "1"

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_json"
path = "fuzz_targets/wire_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "automation"
path = "fuzz_targets/automation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contracts"
path = "fuzz_targets/contracts.rs"
test = false
doc = false
bench = false

[patch.crates-io]
# rong master at one commit until GPU View is finished; replaced by the released
# version numbers at the rong release.
