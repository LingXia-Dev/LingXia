[package]
name = "lingxia-media"
version.workspace = true
edition.workspace = true
description = "Shared media streaming abstractions for LingXia"
license = "MIT"
readme = "README.md"
repository.workspace = true

[features]
default = ["playback", "audio"]
playback = ["dep:lingxia-platform", "dep:serde_json", "dep:log"]
audio = [
    "dep:lingxia-platform",
    "dep:lingxia-messaging",
    "dep:serde",
    "dep:serde_json",
    "dep:log",
    "dep:tokio",
]
# Pipeline + orchestration. Depends on the platform contract only — never on
# lingxia-device-io or a concrete native provider.
capture = ["dep:lingxia-platform", "lingxia-platform/capture-contract"]

[dependencies]
lingxia-platform = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
log = { workspace = true, optional = true }
lingxia-messaging = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
