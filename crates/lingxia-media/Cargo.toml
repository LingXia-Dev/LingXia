[package]
name = "lingxia-media"
version.workspace = true
edition.workspace = true
description = "Shared media streaming abstractions for LingXia"
license = "MIT"
readme = "README.md"
repository.workspace = true

[features]
default = ["playback"]
playback = ["dep:lingxia-platform", "dep:serde_json", "dep:log"]

[dependencies]
lingxia-platform = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
log = { workspace = true, optional = true }
