[package]
name = "lingxia-control-runtime"
version.workspace = true
edition.workspace = true
description = "Shared control dispatch, local IPC, and dev-session bridge for LingXia apps"
license = "MIT"
repository.workspace = true

[features]
default = ["dev-bridge"]
# The `lingxia dev` websocket. Development hosts only — it is what drags in
# tungstenite and rustls, which a shipped product has no reason to carry.
dev-bridge = ["dep:tungstenite", "dep:rustls"]
# The product's local control socket (UDS / named pipe). Opt-in per host,
# derived from appUse/computerUse/browserUse in lingxia.yaml.
local-control = []
browser = ["dep:lingxia-browser", "lingxia/browser-runtime"]
# Automating the machine, not just this app. Derived from
# `capabilities.computerUse`; separate from `local-control` because it is what
# makes the product ask for Accessibility and Screen Recording.
computer-use = ["dep:lingxia-device-io", "lingxia-device-io/full"]
# Session test runner (`lxdev test`). Development hosts only: production
# builds omit it, so the session.test.* methods are absent rather than
# permission-gated.
test-runtime = ["dep:lingxia-automation"]

[dependencies]
lingxia-control-protocol = { workspace = true }
lingxia = { workspace = true, default-features = false, features = ["devtool"] }
lingxia-app-context = { workspace = true }
lingxia-settings = { workspace = true }
lingxia-browser = { workspace = true, optional = true }
lingxia-device-io = { workspace = true, optional = true }
lingxia-log = { workspace = true }
lxapp = { workspace = true, default-features = false }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
tungstenite = { version = "0.29", optional = true, default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
lingxia-automation = { workspace = true, optional = true, features = ["desktop", "runtime-interrupt"] }
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
lingxia-automation = { workspace = true, optional = true, features = ["runtime-interrupt"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
lingxia-automation = { workspace = true, optional = true, features = ["desktop", "runtime"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "ios", target_os = "macos", target_os = "windows")))'.dependencies]
lingxia-automation = { workspace = true, optional = true, features = ["runtime"] }

[target.'cfg(any(target_os = "android", target_os = "ios", all(target_os = "linux", target_env = "ohos")))'.dependencies]
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios", all(target_os = "linux", target_env = "ohos"))))'.dependencies]
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
