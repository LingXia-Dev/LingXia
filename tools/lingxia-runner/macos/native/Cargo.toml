[package]
name = "lingxia-runner-lib"
# Tools version — keep in sync with tools/lingxia-cli (CLI + Runner release
# together). Only the PATCH is independent of the SDK crates; the major.minor
# MUST track [workspace.package] because the Runner embeds the workspace-locked
# base-runtime bridge. See tools/lingxia-cli/Cargo.toml for the full rationale.
version = "0.13.1"
edition.workspace = true
publish = false

# Static library linked into the macOS Swift "LingXia Runner.app".
[lib]
name = "lingxia"
crate-type = ["staticlib"]

[features]
# Cloud provider. Inert by default; `lingxia package/build --with-provider cloud`
# injects the provider crate + (this crate is a workspace member) the root
# crates.io->local patches it needs.
cloud = []

# The runner is a dev container, so it asks the cloud provider for its
# development behavior in addition to runtime lingxiaServer/lingxiaId overrides.
# The CLI reads this to decide which provider features to enable; it hardcodes
# no provider implementation details.
[package.metadata.lingxia.providers.cloud]
features = ["dev"]

# The macOS Runner is a trusted development container: it keeps sessionless
# desktop automation for tests and browser runtime support for lx.surface URL
# surfaces, without taking product-host supervision or browser-shell webui.
[dependencies]
lingxia = { workspace = true, features = ["standard", "devtool", "browser-runtime", "webview-input", "desktop-automation"] }
lingxia-control-runtime = { workspace = true, features = ["browser", "test-runtime"] }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
# Shared resolver for the dev runner's config.toml overrides. This stays a
# regular dependency so `cloud = []` remains available for build-time provider
# injection.
lingxia-runner-config = { workspace = true }
