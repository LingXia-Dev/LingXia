# Source of truth for the host app. Edit this file, not generated app.json / ui.json.

app:
  projectName: {{PROJECT_NAME}}
  rustLibDir: {{RUST_LIB_DIR}}
  # Override per platform only when a store listing already owns a different id.
  packageId: {{PACKAGE_ID}}
  productName: {{PRODUCT_NAME}}
  # productNames:          # locale → name; do not repeat productName
  #   zh-CN: 我的应用
  # Stamped into every platform package. Do not set versionCode / CFBundleVersion
  # in the platform project.
  productVersion: 0.0.1
  lingxiaId: {{LINGXIA_ID}}

  # build/dev → env `dev` (package id + `.dev`); package → `prod`. Override with --env.
  lingxiaServer: https://api.example.com
  # lingxiaServer:
  #   dev: http://127.0.0.1:8080
  #   prod: https://api.example.com

  platforms:
{{PLATFORMS}}
{{HOME_APP_FIELD}}

# Settings entry (one kind). Query values: string, number, boolean, or null.
# Other kinds: browserControlPage (route) | nativeAction (actionId).
# settingsDestination:
#   kind: controlAppPage
#   appId: com.example.control
#   page: settings
#   query:
#     tab: general

# Opaque #RRGGBB. Omitted roles keep platform defaults.
# theme:
#   light:
#     windowBackgroundColor: "#F4F5F7"
#     surfaceBackgroundColor: "#FFFFFF"
#     foregroundColor: "#111827"
#     mutedForegroundColor: "#667085"
#     accentColor: "#2865FF"
#     separatorColor: "#E5E7EB"
#     selectionBackgroundColor: "#EEF3FF"
#   dark:
#     windowBackgroundColor: "#17191C"
#     surfaceBackgroundColor: "#23262B"
#     foregroundColor: "#F3F4F6"
#     mutedForegroundColor: "#9CA3AF"
#     accentColor: "#5B8CFF"
#     separatorColor: "#343840"
#     selectionBackgroundColor: "#303641"
{{ANDROID_SECTION}}{{IOS_SECTION}}{{MACOS_SECTION}}{{HARMONY_SECTION}}{{WINDOWS_SECTION}}{{UI_SECTION}}
features:
  # false → native-only host; bundled/home lxapps must use logic: false.
  appService: {{APP_SERVICE}}
  # `lingxia dev` may enable this without editing the file.
  devtools: false

# Predeclared integrations. Ordinary SDK APIs (camera, …) are not listed here.
capabilities:
  notifications: false  # unlocks lx.app.notification; on iOS/Harmony also registers a push token. Never prompts by itself
  browser: {{BROWSER_CAPABILITY}}
  terminal: {{TERMINAL_CAPABILITY}}
  proxy: false          # desktop; requires browser
  process: false        # desktop; home lxapp may launch OS processes
  autostart: false      # unlocks lx.app.autostart; does not register by itself
  # appUse: true
  # computerUse: true   # implies appUse
  # browserUse: true    # requires browser
  # mediaCapture:       # independent of computerUse
  #   visual: true

{{RESOURCES_SECTION}}
# When capabilities.terminal is true, ship the published settings lxapp.
# resources:
#   bundles:
#     - type: lxapp
#       appId: app.lingxia.terminal-settings
#       package: '@lingxia/terminal-settings'

# Paths relative to the host project root; image/mark must be PNG.
# splash:
#   background: "#171C22"
#   image: design/splash.png
#   mark: design/splash-mark.png
#   minDuration: 600

# In-app host updates. Keys required when any platform is `direct`.
# Channel is per build: flip android to store on the Play-signed package.
# A store-installed process always behaves as store, even if this still says direct.
# update:
#   trustedPublicKeys: [ ... ]
#   channel: direct
#   platforms:
#     ios: store
#     android: direct

# Raw host assets. Use resources.bundles for lxapps.
# assets: assets

# Required when capabilities.browser is true. `path` builds from source;
# `package` / `version` fetch a prebuilt bundle from npm.
# browser:
#   webui:
#     path: vendor/browser-shell-webui

{{SHELL_SECTION}}
{{APP_LINKS_SECTION}}
# Limits in MiB. 0 disables a limit.
storage:
  tempMaxSizeMB: 1024
  cacheMaxSizeMB: 2048     # cleanup at 80%, LRU-evict to 50%
  dataMaxSizeMB: 4096
  appStorageMaxSizeMB: 16384
