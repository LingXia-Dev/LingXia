
# One surface per entry. Declare content + relationship; the host picks the
# platform form (window/panel/sidebar/tab/tray) by screen size.
#
# Content (exactly one): lxapp (appId) | url | native (terminal|browser)
# role: main | aside | float
# edge: aside dock edge (default right; terminal defaults to bottom)
# size / launch / page / query / tray as needed. At most one launch main.
surfaces:
  - {{MAIN_SURFACE_CONTENT}}
    role: main
    launch: true
    # tray:
    #   label: {{PRODUCT_NAME}}
    #   action: activate
    #   # exclusive: true     # no dock / taskbar icon

  # - lxapp: assistant
  #   role: aside
  #   edge: right
  #   size: { width: 320 }

  # - url: https://example.com
  #   role: aside
  #   edge: right

  # - native: terminal
  #   role: aside
  #   edge: bottom
  #   platforms: [macos, windows]

  # - lxapp: panel
  #   role: float
  #   page: tray
  #   query: { source: tray }
  #   tray:
  #     action: toggle
  #     size: { width: 320, height: 480 }
