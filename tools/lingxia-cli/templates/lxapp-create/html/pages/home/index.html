<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 360px; padding: 32px; background: #fff; border-radius: 16px; text-align: center; }
    .form { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    input { height: 44px; padding: 0 14px; border: 1px solid #d2d2d7; border-radius: 10px; font: inherit; }
    button { height: 44px; border: none; border-radius: 10px; background: #007aff; color: #fff; font: inherit; cursor: pointer; }
    .greeting { margin-top: 20px; color: #166534; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, LingXia</h1>
    <div class="form">
      <input id="name" data-testid="home-name" placeholder="Enter your name" />
      <button id="btn" data-testid="home-greet">Say Hello</button>
    </div>
    <p id="greeting" class="greeting" data-testid="home-greeting"></p>
  </div>
  <script type="module" src="./entry.ts"></script>
</body>
</html>
