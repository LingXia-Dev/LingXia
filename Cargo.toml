[workspace]
members = [
    "crates/lingxia-view",
    "crates/lingxia-view-android",
    "crates/lingxia-view-apple",
    "crates/lingxia-view-harmony",
    "crates/lingxia-view-windows",
    "crates/lingxia-app-context",
    "crates/lingxia-theme",
    "crates/lingxia-i18n",
    "crates/lingxia-control-runtime",
    "crates/lingxia-control-protocol",
    "crates/lingxia-media",
    "crates/lingxia-browser-shell",
    "crates/lingxia-browser",
    "crates/lingxia-service",
    "crates/lingxia-transfer",
    "crates/lingxia-terminal",
    "crates/lingxia-terminal-config",
    "crates/lingxia-settings",
    "crates/lingxia-native-macros",
    "crates/lingxia-lxapp",
    "crates/lingxia-log",
    "crates/lingxia-provider",
    "crates/lingxia-update",
    "crates/lingxia-webview",
    "crates/lingxia-windows-contract",
    "crates/lingxia-windows-sdk",
    "crates/lingxia-windows-build",
    "crates/lingxia-platform",
    "crates/lingxia-shell",
    "crates/lingxia-surface",
    "crates/lingxia-logic",
    "crates/lingxia-automation",
    "crates/lingxia-network-dev",
    "crates/lingxia-messaging",
    "crates/lingxia",
    "crates/lingxia-proxy",
    "crates/lingxia-device-io",
    "crates/lingxia-control-commands",
    "tools/lingxia-runner/macos/native",
    "tools/lingxia-runner/windows",
    "tools/lingxia-runner/config",
    "tools/lingxia-cli",
    "tools/lingxia-devtools-cli",
    "crates/lingxia-native-codegen",
    "xtask",
]
exclude = [
    "examples/lingxia-showcase/native",
    "examples/lingxia-showcase/windows",
    # Private provider crates CI checks out into the tree. `actions/checkout`
    # cannot place them outside `GITHUB_WORKSPACE`, and each carries its own
    # workspace root, which cargo refuses to nest inside this one.
    ".ci",
]
resolver = "2"

[workspace.package]
version = "0.30.0"
edition = "2024"
repository = "https://github.com/LingXia-Dev/LingXia"

[workspace.dependencies]
# Common dependencies that can be shared across workspace members
tokio = { version = "1.0", features = ["rt", "time", "macros", "sync"] }
futures = "0.3.34"
futures-core = "0.3.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
thiserror = "2.0.20"
dashmap = "6.2.1"
urlencoding = "2.1.3"
base64 = "0.23.1"
language-tags = "0.3.2"
rcgen = "0.14.10"
redb = "4.3.0"
resvg = "0.48.1"
usvg = "0.48.1"
tiny-skia = "0.12.0"
log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["registry"] }
# Latest published coordinated set. `windows` 0.100 is not on crates.io yet;
# `windows-core` 0.100 cannot mix with `windows` 0.62 / webview2-com 0.39.
windows = { version = "0.62.2", default-features = false }
windows-core = { version = "0.62.2", default-features = false }

# Workspace-local crates
lingxia-lxapp = { path = "crates/lingxia-lxapp", version = "0.30.0", default-features = false }
lxapp = { package = "lingxia-lxapp", path = "crates/lingxia-lxapp", version = "0.30.0", default-features = false }
lingxia-control-runtime = { path = "crates/lingxia-control-runtime", version = "0.30.0" }
lingxia-control-protocol = { path = "crates/lingxia-control-protocol", version = "0.30.0" }
lingxia-device-io = { path = "crates/lingxia-device-io", version = "0.30.0", default-features = false }
lingxia-control-commands = { path = "crates/lingxia-control-commands", version = "0.30.0" }
lingxia-log = { path = "crates/lingxia-log", version = "0.30.0" }
lingxia-provider = { path = "crates/lingxia-provider", version = "0.30.0" }
lingxia-update = { path = "crates/lingxia-update", version = "0.30.0" }
lingxia-app-context = { path = "crates/lingxia-app-context", version = "0.30.0" }
lingxia-theme = { path = "crates/lingxia-theme", version = "0.30.0" }
lingxia-i18n = { path = "crates/lingxia-i18n", version = "0.30.0" }
lingxia-media = { path = "crates/lingxia-media", version = "0.30.0" }
lingxia-webview = { path = "crates/lingxia-webview", version = "0.30.0" }
lingxia-automation = { path = "crates/lingxia-automation", version = "0.30.0" }
lingxia-network-dev = { path = "crates/lingxia-network-dev", version = "0.30.0" }
lingxia-windows-contract = { path = "crates/lingxia-windows-contract", version = "0.30.0" }
lingxia-windows-sdk = { path = "crates/lingxia-windows-sdk", version = "0.30.0", default-features = false }
lingxia-windows-build = { path = "crates/lingxia-windows-build", version = "0.30.0" }
lingxia-platform = { path = "crates/lingxia-platform", version = "0.30.0" }
lingxia-shell = { path = "crates/lingxia-shell", version = "0.30.0" }
lingxia-surface = { path = "crates/lingxia-surface", version = "0.30.0" }
lingxia-messaging = { path = "crates/lingxia-messaging", version = "0.30.0" }
lingxia-logic = { path = "crates/lingxia-logic", version = "0.30.0" }
lingxia = { path = "crates/lingxia", version = "0.30.0", default-features = false }
lingxia-native-codegen = { path = "crates/lingxia-native-codegen", version = "0.30.0" }
lingxia-proxy = { path = "crates/lingxia-proxy", version = "0.30.0" }
lingxia-native-macros = { path = "crates/lingxia-native-macros", version = "0.30.0" }
lingxia-browser = { path = "crates/lingxia-browser", version = "0.30.0" }
lingxia-service = { path = "crates/lingxia-service", version = "0.30.0" }
lingxia-transfer = { path = "crates/lingxia-transfer", version = "0.30.0" }
lingxia-view = { path = "crates/lingxia-view", version = "0.30.0" }
lingxia-view-android = { path = "crates/lingxia-view-android", version = "0.30.0" }
lingxia-view-apple = { path = "crates/lingxia-view-apple", version = "0.30.0" }
lingxia-view-harmony = { path = "crates/lingxia-view-harmony", version = "0.30.0" }
lingxia-view-windows = { path = "crates/lingxia-view-windows", version = "0.30.0" }
lingxia-terminal = { path = "crates/lingxia-terminal", version = "0.30.0" }
lingxia-terminal-config = { path = "crates/lingxia-terminal-config", version = "0.30.0" }
lingxia-settings = { path = "crates/lingxia-settings", version = "0.30.0" }
lingxia-browser-shell = { path = "crates/lingxia-browser-shell", version = "0.30.0" }
lingxia-runner-config = { path = "tools/lingxia-runner/config", version = "0.30.1" }

# Harmony NAPI bindings
napi-ohos = "1.2.0"
napi-derive-ohos = "1.2.0"
napi-sys-ohos = "1.2.0"

# View renderer stack, pinned exactly: the core and its adapters share one
# version of each.
skrifa = "=0.44.0"
vello_cpu = "=0.3.0"
vello_common = { version = "=0.3.0", default-features = false }
vello_gpu = { version = "=0.3.0", default-features = false }
glifo = "=0.4.0"
wgpu = { version = "=30.0.0", default-features = false }
raw-window-handle = "=0.6.2"
parley = { version = "=0.12.0", default-features = false }
taffy = "=0.14.0"
pollster = "=0.4.0"
rong_core = "=0.8.0"
rong_quickjs_sys = "=0.7.0"
memmap2 = "0.9.11"
libc = "0.2"

# Rong v0.8 product release
rong = { version = "0.8.0", default-features = false }
rong_rt = { version = "0.6.4", default-features = false }
rong_modules = { version = "0.8.0", default-features = false }
rong_http = { version = "0.8.0", default-features = false }
rong_console = "0.8.0"
rong_event = "0.8.0"
rong_storage = "0.8.0"
rong_abort = "0.8.0"
rong_assert = "0.8.0"
rong_buffer = "0.8.0"
rong_encoding = "0.8.0"
rong_exception = "0.8.0"
rong_stream = "0.8.0"
rong_timer = "0.8.0"
rong_url = "0.8.0"

[patch.crates-io]
