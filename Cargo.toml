# taffy 0.14 with two flexbox fixes (third_party/taffy/LINGXIA-PATCHES.md), until upstream takes them.
taffy = { path = "third_party/taffy" }
portable-pty = { git = "https://github.com/LingXia-Dev/wezterm.git", rev = "59d0fb89c54a77c12afe2561dc6969d8dc55fc4f", package = "portable-pty" }

# Renderer hot path: fast enough in debug builds that gesture and spring timing stay trustworthy.
[profile.dev.package.lingxia-view]
opt-level = 2
[profile.dev.package.lingxia-view-apple]
opt-level = 2
[profile.dev.package.lingxia-view-windows]
opt-level = 2
[profile.dev.package.lingxia-view-android]
opt-level = 2
# Keys the View bytecode cache on every page open.
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 2
[profile.dev.package.vello_common]
opt-level = 2
[profile.dev.package.vello_gpu]
opt-level = 2
[profile.dev.package.parley]
opt-level = 2
[profile.dev.package.taffy]
opt-level = 2
[profile.dev.package.wgpu]
opt-level = 2
[profile.dev.package.wgpu-core]
opt-level = 2
[profile.dev.package.wgpu-hal]
opt-level = 2
# Translates every WGSL shader when the first page creates its GPU renderer.
[profile.dev.package.naga]
opt-level = 2
[profile.dev.package.rong_quickjs]
opt-level = 2
[profile.dev.package.rong_quickjs_sys]
opt-level = 2
[profile.dev.package.rong_core]
opt-level = 2
[profile.dev.package.skrifa]
opt-level = 2
[profile.dev.package.read-fonts]
opt-level = 2
[profile.dev.package.harfrust]
opt-level = 2
[profile.dev.package.kurbo]
opt-level = 2
[profile.dev.package.glifo]
opt-level = 2
[profile.dev.package.fontique]
opt-level = 2
[profile.dev.package.peniko]
opt-level = 2
[profile.dev.package.fearless_simd]
opt-level = 2
[profile.dev.package.color]
opt-level = 2
[profile.dev.package.guillotiere]
opt-level = 2
[profile.dev.package.bytemuck]
opt-level = 2
[profile.dev.package.smallvec]
opt-level = 2
[profile.dev.package.lingxia-view-harmony]
opt-level = 2
# wgpu's GLES backend (Harmony, Android fallback) sends every call through these.
[profile.dev.package.glow]
opt-level = 2
[profile.dev.package.khronos-egl]
opt-level = 2
[profile.dev.package.wgpu-types]
opt-level = 2
# wgpu's Metal backend sends every call through these.
[profile.dev.package.objc2]
opt-level = 2
[profile.dev.package.objc2-metal]
opt-level = 2
[profile.dev.package.objc2-foundation]
opt-level = 2
[profile.dev.package.objc2-quartz-core]
opt-level = 2
[profile.dev.package.block2]
opt-level = 2
