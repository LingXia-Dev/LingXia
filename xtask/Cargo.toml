[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

# `lingxia pin` builds a pinned commit's SDKs through `cargo xtask sdk`; it
# reads this before calling, and an older commit without it goes through
# scripts/release/sdk.sh. Bump on an incompatible change to the arguments or
# the artifact names.
[package.metadata.lingxia]
sdk-interface = 1

[dependencies]
anyhow = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
