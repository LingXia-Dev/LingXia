app:
  projectName: lingxia
  rustLibDir: native
  lingxiaId: lingxia-showcase
  productName: LingXia
  productVersion: 0.2.6
  platforms:
    - android
    - ios
    - macos
    - harmony
    - windows
  homeAppId: lingxia-showcase

  lingxiaServer:
    developer: http://192.168.37.211:8080
    release: http://192.168.37.211:8080

android:
  packageId: com.lingxia.example.lxapp
  minSdk: 29
  targetSdk: 35
  compileSdk: 35

ios:
  bundleId: app.lingxia.example.lxapp
  deploymentTarget: "17.0"
  targetName: lxapp

macos:
  bundleId: app.lingxia.example.lxapp
  deploymentTarget: "12.0"
  targetName: LingXiaDemo
  executableName: LingXiaDemo

harmony:
  bundleName: app.lingxia.lxapp.example

windows:
  appId: app.lingxia.example.lxapp
  executableName: LingXiaDemo

shellTheme:
  light:
    windowBackgroundColor: "#F2F2F7"
    surfaceBackgroundColor: "#FFFFFF"
    foregroundColor: "#1D1D1F"
    mutedForegroundColor: "#6E6E73"
    accentColor: "#007AFF"
    separatorColor: "#D1D1D6"
    selectionBackgroundColor: "#E5F1FF"
    sidebarBackgroundColor: "#F2F2F7"
    sidebarForegroundColor: "#3A3A3C"
    sidebarSelectedBackgroundColor: "#FFFFFF"
    sidebarSelectedForegroundColor: "#1D1D1F"
  dark:
    windowBackgroundColor: "#1C1C1E"
    surfaceBackgroundColor: "#2C2C2E"
    foregroundColor: "#F5F5F7"
    mutedForegroundColor: "#98989D"
    accentColor: "#0A84FF"
    separatorColor: "#3A3A3C"
    selectionBackgroundColor: "#1B3A57"
    sidebarBackgroundColor: "#1C1C1E"
    sidebarForegroundColor: "#E5E5EA"
    sidebarSelectedBackgroundColor: "#2C2C2E"
    sidebarSelectedForegroundColor: "#FFFFFF"

features:
  appService: true
  devtools: false

browser:
  # In-monorepo dev — point at SDK source.
  # External apps omit this to use the npm default.
  webui:
    path: ../../crates/lingxia-browser-shell/webui

capabilities:
  notifications: true
  browser: true
  proxy: true
  terminal: true
  autostart: true

resources:
  bundles:
    - type: lxapp
      appId: lingxia-showcase
      path: lxapp
    - type: lxapp
      appId: lingxia-chat
      path: ../lingxia-chat

surfaces:
  - lxapp: lingxia-showcase
    role: main
    launch: true
    tray: # dock + tray: dock icon stays, tray brings the window to front
      icon: icons/tray.svg
      label: LingXia
      action: activate
  - lxapp: lingxia-chat
    role: aside
    edge: right
  - native: terminal
    role: aside
    edge: bottom
    platforms: [macos, windows] # terminal is desktop-only

appLinks:
  hosts:
    - applink.lingxia.app

storage:
  tempMaxSizeMB: 1024
  cacheMaxSizeMB: 2048
  dataMaxSizeMB: 4096
  appStorageMaxSizeMB: 16384
