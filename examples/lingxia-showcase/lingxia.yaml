app:
  projectName: lingxia
  rustLibDir: native
  lingxiaId: lingxia-showcase
  productName: LingXia
  productVersion: 0.2.7
  platforms:
    - android
    - ios
    - macos
    - harmony
    - windows
  homeAppId: lingxia-showcase

  lingxiaServer:
    developer: http://192.168.37.211:8080
    release: http://192.168.37.211:8080

android:
  packageId: com.lingxia.example.lxapp
  webviewBackend: servo
  minSdk: 29
  targetSdk: 35
  compileSdk: 35

ios:
  bundleId: app.lingxia.example.lxapp
  deploymentTarget: "17.0"
  targetName: lxapp

macos:
  bundleId: app.lingxia.example.lxapp
  deploymentTarget: "12.0"
  targetName: LingXiaDemo
  executableName: LingXiaDemo

harmony:
  bundleName: app.lingxia.lxapp.example

windows:
  appId: app.lingxia.example.lxapp
  executableName: LingXiaDemo

features:
  appService: true
  devtools: false

browser:
  # In-monorepo dev — point at SDK source.
  # External apps omit this to use the npm default.
  webui:
    path: ../../crates/lingxia-browser-shell/webui

capabilities:
  notifications: true
  browser: true
  proxy: true
  terminal: true
  autostart: true
  appUse: true
  computerUse: true
  browserUse: true

resources:
  bundles:
    - type: lxapp
      appId: lingxia-showcase
      path: lxapp
    - type: lxapp
      appId: lingxia-chat
      path: ../lingxia-chat
    - type: lxapp
      appId: app.lingxia.terminal-settings
      path: ../../packages/lingxia-terminal-settings

surfaces:
  - lxapp: lingxia-showcase
    role: main
    launch: true
    tray: # dock + tray: dock icon stays, tray brings the window to front
      icon: icons/tray.svg
      label: LingXia
      action: activate
  - lxapp: lingxia-chat
    role: aside
    edge: right
  - native: terminal
    role: aside
    edge: bottom
    platforms: [macos, windows] # terminal is desktop-only

appLinks:
  hosts:
    - applink.lingxia.app

# Host-declared page floor: the colour the showcase lxapp's own CSS paints its
# pages with (`--lx-surface-100` in lxapp/theme/tokens.css). Native chrome that
# borders the page matches it — most visibly the strip a pull-to-refresh opens
# above the page, which without this bares the platform's system background.
theme:
  light:
    pageBackgroundColor: "#E5E5EA"
  dark:
    pageBackgroundColor: "#2A2A2E"

splash:
  # One face, both appearances. The launch screen is a brand asset, not a UI
  # surface that follows the system: a single picture is the same on every
  # launch, on every device, and cannot disagree with the frame the OS drew
  # before this process existed. The ground is the art's own, so the OS frame
  # reads as the art's entrance rather than as a flash.
  background: "#171C22"
  image: design/splash.png
  mark: design/splash-mark.png
  # No `minDuration`: the launch face only covers the boot, so the default
  # floor is enough and the face lifts the moment home is ready.

storage:
  tempMaxSizeMB: 1024
  cacheMaxSizeMB: 2048
  dataMaxSizeMB: 4096
  appStorageMaxSizeMB: 16384
