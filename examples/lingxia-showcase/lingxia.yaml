app:
  projectName: lingxia
  rustLibDir: native
  lingxiaId: lingxia-showcase
  packageId: app.lingxia.example.lxapp
  productName: LingXia
  productVersion: 0.2.7
  platforms: [android, macos, ios, harmony, windows]
  homeAppId: lingxia-showcase
  lingxiaServer:
    dev: http://192.168.37.211:8080
    prod: http://192.168.37.211:8080

update:
  trustedPublicKeys:
    - 6kpsY-KcUgq-9VB7Ey7F-ZVHdq6-vnuSQh7qaRRG0iw

android:
  packageId: com.lingxia.example.lxapp
  minSdk: 29
  targetSdk: 35
  compileSdk: 35

ios:
  deploymentTarget: "17.0"
  targetName: lxapp

windows:

macos:
  deploymentTarget: "12.0"
  targetName: LingXiaDemo

harmony:
  bundleName: app.lingxia.lxapp.example

features:
  appService: true
  devtools: false

capabilities:
  notifications: true
  browser: true
  proxy: true
  terminal: true
  autostart: true
  appUse: true
  computerUse: true
  browserUse: true

# The browser's system pages (History, Bookmarks, Downloads, Settings) are this demo's
# own lxapp; a host without `browser.webui` shows none of them.
browser:
  webui:
    path: browser

terminal:
  settings:
    path: terminal-settings

# Host-owned Settings chrome resolves this sealed destination on every click.
settingsDestination:
  kind: browserControlPage
  route: /settings

resources:
  bundles:
    - type: lxapp
      appId: lingxia-showcase
      path: lxapp
    - type: lxapp
      appId: lingxia-showcase-web
      path: ../lingxia-showcase-web

surfaces:
  - lxapp: lingxia-showcase
    role: main
    launch: true
    tray: # dock + tray: dock icon stays, tray brings the window to front
      icon: icons/tray.svg
      label: LingXia
      action: activate
  - lxapp: lingxia-showcase-web
    page: chat
    role: aside
    edge: right
  - native: terminal
    role: aside
    edge: bottom
    platforms: [macos, windows] # terminal is desktop-only

appLinks:
  hosts:
    - applink.lingxia.app

theme:
  light:
    pageBackgroundColor: "#F6F7FB"
  dark:
    pageBackgroundColor: "#121C30"

splash:
  background: "#171C22"
  image: design/splash.png
  mark: design/splash-mark.png

storage:
  tempMaxSizeMB: 1024
  cacheMaxSizeMB: 2048
  dataMaxSizeMB: 4096
  appStorageMaxSizeMB: 16384
